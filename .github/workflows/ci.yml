name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: mvn -B -DskipTests=true package
      - name: Run unit tests
        run: mvn -B test
      - name: Run mocked Binance WS test only
        run: mvn -B -DskipTests=false -Dtest=MockedBinanceWebSocketTest test

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run integration tests (ComprehensiveIntegrationTest)
        run: mvn -B -DskipTests=false -Dtest=ComprehensiveIntegrationTest test
