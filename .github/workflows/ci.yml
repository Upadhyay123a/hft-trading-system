name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        run: mvn -B -DskipTests=true package
      - name: Run unit tests
        run: mvn -B test
      - name: Run mocked Binance WS test only
        run: mvn -B -DskipTests=false -Dtest=MockedBinanceWebSocketTest test

  integration:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run integration tests (ComprehensiveIntegrationTest)
        run: mvn -B -DskipTests=false -Dtest=ComprehensiveIntegrationTest test

  security:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "NVD_API_KEY is not configured; skipping dependency-check to avoid hanging on external NVD sync."
            exit 0
          fi
          echo "Running dependency-check (NVD feed via secret)"
          mvn -B org.owasp:dependency-check-maven:check \
            -Dnvd.api.key="${NVD_API_KEY}" \
            -Dformat=ALL \
            -DfailBuildOnCVSS=9 \
            -Dnvd.maxRetryCount=3 \
            -Dnvd.api.delay=3000
